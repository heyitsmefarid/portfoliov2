    <title>Fred Anthony Gallano — Full-Stack Developer</title>

      name="description"
      content="Portfolio of Fred Anthony Gallano, a BS Information Systems student focused on web, mobile, and full-stack development."
    />
    <meta name="author" content="Fred Anthony Gallano" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before the first paint (default: dark).
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f4f1')
        }

        // Play the start-up intro once per visit (never with reduced motion).
        try {
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (!reduced && !sessionStorage.getItem('intro-seen')) {
            document.documentElement.classList.add('intro-playing')
          }
        } catch (e) {}
      })()
    </script>
