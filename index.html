    <title>Fred Anthony Gallano — Full-Stack Developer</title>

      name="description"
      content="Fred Anthony Gallano is a full-stack web and mobile developer and BS Information Systems student in Calapan City, Philippines. Open to OJT, freelance and remote work."
    />
    <meta name="author" content="Fred Anthony Gallano" />
    <meta name="theme-color" content="#c3dfcb" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the theme before the first paint: the saved choice, else the
      // system setting, else the mint form (light).
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08211a')
        }

        // Play the start-up intro once per visit (never with reduced motion).
        try {
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (!reduced && location.pathname === '/' && !sessionStorage.getItem('intro-seen')) {
            document.documentElement.classList.add('intro-playing')
          }
        } catch (e) {}
      })()
    </script>

    <style>
      /* Before the app loads, the screen is already the intro's colour, so the
         logo animation never opens on a flash of the page. */
      html.intro-playing,
      html.intro-playing body {
        background: #0e3a2d;
      }
      html.intro-playing[data-theme='dark'],
      html.intro-playing[data-theme='dark'] body {
        background: #cfeedb;
      }
    </style>
